version: '3.9'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: monkey_db
    environment:
      POSTGRES_USER: monkey
      POSTGRES_PASSWORD: monkey_secret
      POSTGRES_DB: monkey_knowledge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monkey"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: monkey_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build: .
    container_name: monkey_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://monkey:monkey_secret@db:5432/monkey_knowledge
      REDIS_URL: redis://redis:6379/0
      GROQ_API_KEY: ${GROQ_API_KEY}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - .:/app

volumes:
  postgres_data:
  redis_data:
